services:
  investment-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Which vars are actually required depends on AGENT_PROVIDER
      # (openai_compatible by default) - both providers' vars are left
      # optional here since only one set is needed at a time; a missing
      # key surfaces as an auth error from the provider on first use.
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openai_compatible}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      INVESTMENT_AGENT_ANTHROPIC_API_KEY: ${INVESTMENT_AGENT_ANTHROPIC_API_KEY:-}
      INTERNAL_PRICE_API_URL: ${INTERNAL_PRICE_API_URL:-http://localhost:9000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src:/app/src
